name: Release Result Resilience Check

on:
  pull_request:
    paths:
      - "v2_event_official_release_resilience.py"
      - "v2_event_official_previous_resilience.py"
      - "scripts/test_release_resilience.py"
      - "scripts/test_previous_value_resilience.py"
      - "scripts/check_release_resilience_live.py"
      - "scripts/check_previous_value_resilience_live.py"
      - "scripts/update_event_radar_snapshot.py"
      - ".github/workflows/release-resilience-pr-check.yml"
  push:
    branches: [main]
    paths:
      - "v2_event_official_release_resilience.py"
      - "v2_event_official_previous_resilience.py"
      - "scripts/test_release_resilience.py"
      - "scripts/test_previous_value_resilience.py"
      - "scripts/check_release_resilience_live.py"
      - "scripts/check_previous_value_resilience_live.py"
      - "scripts/update_event_radar_snapshot.py"
      - ".github/workflows/release-resilience-pr-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-resilience-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-event-radar.txt
      - name: Install collector dependencies
        run: pip install -r requirements-event-radar.txt
      - name: Compile release resilience path
        run: |
          python -m py_compile \
            v2_event_official_release_resilience.py \
            v2_event_official_previous_resilience.py \
            scripts/test_release_resilience.py \
            scripts/test_previous_value_resilience.py \
            scripts/check_release_resilience_live.py \
            scripts/check_previous_value_resilience_live.py \
            scripts/update_event_radar_snapshot.py
      - name: Run deterministic release regressions
        run: |
          python scripts/test_release_resilience.py
          python scripts/test_previous_value_resilience.py
      - name: Probe first-party release sources
        run: |
          python scripts/check_release_resilience_live.py
          python scripts/check_previous_value_resilience_live.py
