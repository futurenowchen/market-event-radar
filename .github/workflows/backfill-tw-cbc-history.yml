name: Backfill Taiwan CBC history

on:
  pull_request:
    paths:
      - "scripts/backfill_tw_cbc_history.py"
      - ".github/workflows/backfill-tw-cbc-history.yml"
  push:
    branches: [main]
    paths:
      - "scripts/backfill_tw_cbc_history.py"
      - ".github/workflows/backfill-tw-cbc-history.yml"

permissions:
  contents: write

concurrency:
  group: backfill-tw-cbc-history
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-event-radar.txt
      - name: Install collector dependencies
        run: pip install -r requirements-event-radar.txt
      - name: Compile backfill utility
        run: python -m py_compile scripts/backfill_tw_cbc_history.py
      - name: Verify first-party historical release
        run: python scripts/backfill_tw_cbc_history.py --date 2026-09-17 --dry-run
      - name: Append released CBC evidence to history
        if: github.event_name == 'push'
        run: python scripts/backfill_tw_cbc_history.py --date 2026-09-17
      - name: Commit history backfill
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "market-event-radar-bot"
          git config user.email "market-event-radar-bot@users.noreply.github.com"
          git add -- data/history
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          git commit -m "data: backfill Taiwan CBC release history"
          git push
