name: Vendor production collector

on:
  push:
    branches:
      - bootstrap/public-radar
    paths:
      - ".github/workflows/vendor-production-collector.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Market Event Radar
        uses: actions/checkout@v4
        with:
          ref: bootstrap/public-radar
          path: radar

      - name: Checkout proven collector source
        uses: actions/checkout@v4
        with:
          repository: futurenowchen/investment-dashboard
          ref: main
          path: source

      - name: Copy collector runtime
        shell: bash
        run: |
          cp source/v2_event_radar.py radar/v2_event_radar.py
          cp source/v2_event_official.py radar/v2_event_official.py
          cp source/v2_event_official_asia.py radar/v2_event_official_asia.py
          cp source/v2_event_official_taiwan.py radar/v2_event_official_taiwan.py
          cp source/v2_event_official_resilience.py radar/v2_event_official_resilience.py
          cp source/v2_event_company_ir.py radar/v2_event_company_ir.py
          cp source/requirements-event-radar.txt radar/requirements-event-radar.txt
          cp source/scripts/update_event_radar_snapshot.py radar/scripts/update_event_radar_snapshot.py
          cp source/scripts/check_event_official_backend.py radar/scripts/check_event_official_backend.py
          sed -i 's#https://github.com/futurenowchen/investment-dashboard#https://github.com/futurenowchen/market-event-radar#g' radar/v2_event_official.py radar/v2_event_radar.py || true

      - name: Commit vendored collector
        working-directory: radar
        shell: bash
        run: |
          git config user.name "market-event-radar-bot"
          git config user.email "market-event-radar-bot@users.noreply.github.com"
          git add -- \
            v2_event_radar.py \
            v2_event_official.py \
            v2_event_official_asia.py \
            v2_event_official_taiwan.py \
            v2_event_official_resilience.py \
            v2_event_company_ir.py \
            requirements-event-radar.txt \
            scripts/update_event_radar_snapshot.py \
            scripts/check_event_official_backend.py
          if git diff --cached --quiet; then
            echo "Collector runtime already synchronized."
            exit 0
          fi
          git commit -m "feat: vendor self-contained official collector runtime"
          git push origin HEAD:bootstrap/public-radar
