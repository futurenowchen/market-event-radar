name: Taiwan CBC Resilience Check

on:
  pull_request:
    paths:
      - "v2_event_official_taiwan_resilience.py"
      - "scripts/test_tw_cbc_resilience.py"
      - "scripts/check_tw_cbc_resilience_live.py"
      - ".github/workflows/tw-cbc-resilience-pr-check.yml"
  push:
    branches: [main]
    paths:
      - "v2_event_official_taiwan_resilience.py"
      - "scripts/test_tw_cbc_resilience.py"
      - "scripts/check_tw_cbc_resilience_live.py"
      - ".github/workflows/tw-cbc-resilience-pr-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tw-cbc-resilience-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tw-cbc-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-event-radar.txt
      - name: Install collector dependencies
        run: pip install -r requirements-event-radar.txt
      - name: Compile Taiwan CBC path
        run: |
          python -m py_compile \
            v2_event_official_taiwan_resilience.py \
            scripts/test_tw_cbc_resilience.py \
            scripts/check_tw_cbc_resilience_live.py
      - name: Run deterministic Taiwan CBC regressions
        run: python scripts/test_tw_cbc_resilience.py
      - name: Probe first-party Taiwan CBC release
        run: python scripts/check_tw_cbc_resilience_live.py
