name: Refresh market event feed

on:
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
    inputs:
      force_daily:
        description: "Force a full 7-day refresh"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: market-event-radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout public feed repository
        uses: actions/checkout@v4
        with:
          path: radar

      # Transitional bootstrap only. The next migration step moves these collectors
      # into this repository, after which this checkout is removed and the original
      # investment dashboard can safely become private.
      - name: Checkout current collector engine
        uses: actions/checkout@v4
        with:
          repository: futurenowchen/investment-dashboard
          ref: main
          path: engine

      - name: Decide whether a network refresh is needed
        id: gate
        shell: bash
        run: |
          FORCE="${{ github.event.inputs.force_daily || 'false' }}"
          python radar/scripts/refresh_gate.py \
            --snapshot radar/data/latest.json \
            --force-daily "$FORCE"

      - name: Setup Python
        if: steps.gate.outputs.mode != 'none'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements-event-radar.txt

      - name: Install collector dependencies
        if: steps.gate.outputs.mode != 'none'
        run: pip install -r engine/requirements-event-radar.txt

      - name: Refresh public snapshot
        if: steps.gate.outputs.mode != 'none'
        run: |
          python engine/scripts/update_event_radar_snapshot.py \
            --mode "${{ steps.gate.outputs.mode }}" \
            --snapshot "$GITHUB_WORKSPACE/radar/data/latest.json"

      - name: Validate refreshed snapshot
        if: steps.gate.outputs.mode != 'none'
        working-directory: radar
        run: python scripts/validate_snapshot.py data/latest.json

      - name: Commit refreshed public feed
        if: steps.gate.outputs.mode != 'none'
        working-directory: radar
        shell: bash
        run: |
          git config user.name "market-event-radar-bot"
          git config user.email "market-event-radar-bot@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "data: refresh market event feed"
          git push
