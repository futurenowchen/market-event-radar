name: Refresh market event feed

on:
  push:
    branches:
      - main
    paths:
      - "v2_event_radar.py"
      - "v2_event_official.py"
      - "v2_event_official_asia.py"
      - "v2_event_official_taiwan.py"
      - "v2_event_official_resilience.py"
      - "v2_event_company_ir.py"
      - "requirements-event-radar.txt"
      - "scripts/refresh_gate.py"
      - "scripts/update_event_radar_snapshot.py"
      - ".github/workflows/refresh.yml"
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
    inputs:
      force_daily:
        description: "Force a full 7-day refresh"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: market-event-radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether a network refresh is needed
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            FORCE="true"
          else
            FORCE="${{ github.event.inputs.force_daily || 'false' }}"
          fi
          python scripts/refresh_gate.py \
            --snapshot data/latest.json \
            --force-daily "$FORCE"

      - name: Setup Python
        if: steps.gate.outputs.mode != 'none'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-event-radar.txt

      - name: Install collector dependencies
        if: steps.gate.outputs.mode != 'none'
        run: pip install -r requirements-event-radar.txt

      - name: Refresh public snapshot
        if: steps.gate.outputs.mode != 'none'
        run: |
          python scripts/update_event_radar_snapshot.py \
            --mode "${{ steps.gate.outputs.mode }}" \
            --snapshot data/latest.json

      - name: Validate refreshed snapshot
        if: steps.gate.outputs.mode != 'none'
        run: python scripts/validate_snapshot.py data/latest.json

      - name: Commit refreshed public feed
        if: steps.gate.outputs.mode != 'none'
        shell: bash
        run: |
          git config user.name "market-event-radar-bot"
          git config user.email "market-event-radar-bot@users.noreply.github.com"
          git add -- data/latest.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "data: refresh market event feed"
          git push
