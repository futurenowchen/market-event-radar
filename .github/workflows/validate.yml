name: Validate public feed

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-event-radar.txt
      - name: Validate snapshot contract
        run: python scripts/validate_snapshot.py data/latest.json
      - name: Install package and collector dependencies
        run: |
          python -m pip install .
          python -m pip install -r requirements-event-radar.txt
      - name: Compile standalone collector runtime
        run: |
          python -m py_compile \
            v2_event_radar.py \
            v2_event_official.py \
            v2_event_official_asia.py \
            v2_event_official_taiwan.py \
            v2_event_official_resilience.py \
            v2_event_official_taiwan_resilience.py \
            v2_event_release_metrics.py \
            v2_event_official_us_high_signal.py \
            v2_event_official_us_phase2.py \
            v2_event_official_us_claims.py \
            v2_event_official_us_phase3.py \
            v2_event_official_us_phase4.py \
            v2_event_official_us_phase4_resilience.py \
            v2_event_company_ir.py \
            market_event_radar/consensus.py \
            market_event_radar/consensus_mapping.py \
            market_event_radar/surprise.py \
            market_event_radar/providers/trading_economics.py \
            scripts/canary_trading_economics_consensus.py \
            scripts/refresh_gate.py \
            scripts/update_event_radar_snapshot.py \
            scripts/update_event_history.py \
            scripts/check_radar_health.py \
            scripts/check_event_official_backend.py \
            scripts/test_release_metrics.py \
            scripts/test_consensus_surprise.py \
            scripts/test_consensus_mapping.py \
            scripts/test_trading_economics_canary.py \
            scripts/test_us_phase2.py \
            scripts/test_us_claims.py \
            scripts/test_us_phase3.py \
            scripts/test_us_phase4.py
      - name: Test event history ledger
        run: python scripts/test_event_history.py
      - name: Test release metric bundles
        run: python scripts/test_release_metrics.py
      - name: Test consensus and surprise layer
        run: python scripts/test_consensus_surprise.py
      - name: Test consensus provider mappings
        run: python scripts/test_consensus_mapping.py
      - name: Test Trading Economics canary helpers
        run: python scripts/test_trading_economics_canary.py
      - name: Dry-run Trading Economics canary without credentials
        run: python scripts/canary_trading_economics_consensus.py --snapshot data/latest.json --limit 10
      - name: Test Phase 2 US events
        run: python scripts/test_us_phase2.py
      - name: Test DOL claims PDF parser
        run: python scripts/test_us_claims.py
      - name: Test Phase 3 US events
        run: python scripts/test_us_phase3.py
      - name: Test Phase 4 US event policy
        run: python scripts/test_us_phase4.py
      - name: Smoke test package API
        run: |
          python - <<'PY'
          from datetime import datetime
          from market_event_radar import event_risk_level, load_snapshot, supported_metric_ids

          snapshot = load_snapshot("data/latest.json")
          assert snapshot.schema_version == 2
          assert len(snapshot.events) > 0
          assert "headline_yoy" in supported_metric_ids()
          level, score = event_risk_level(
              snapshot.events,
              hours=24 * 14,
              now=datetime.fromisoformat("2026-08-24T00:00:00+08:00"),
          )
          assert level in {"LOW", "NORMAL", "ELEVATED", "HIGH"}
          assert score in {1, 2, 3}
          print(f"package smoke passed: {len(snapshot.events)} events, risk={level}")
          PY
      - name: Probe official-source collectors
        run: python scripts/check_event_official_backend.py
