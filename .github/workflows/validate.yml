name: Validate public feed

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate snapshot contract
        run: python scripts/validate_snapshot.py data/latest.json
      - name: Install package
        run: python -m pip install .
      - name: Smoke test package API
        run: |
          python - <<'PY'
          from datetime import datetime
          from market_event_radar import event_risk_level, load_snapshot

          snapshot = load_snapshot("data/latest.json")
          assert snapshot.schema_version == 2
          assert len(snapshot.events) > 0
          level, score = event_risk_level(
              snapshot.events,
              hours=24 * 14,
              now=datetime.fromisoformat("2026-08-24T00:00:00+08:00"),
          )
          assert level in {"LOW", "NORMAL", "ELEVATED", "HIGH"}
          assert score in {1, 2, 3}
          print(f"package smoke passed: {len(snapshot.events)} events, risk={level}")
          PY
