[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "market-event-radar"
version = "0.1.0"
description = "Free, official-source-first financial event radar and public JSON feed"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "futurenowchen"}]
keywords = ["finance", "economic-calendar", "market-events", "fomc", "cpi", "earnings"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/futurenowchen/market-event-radar"
Repository = "https://github.com/futurenowchen/market-event-radar"

[tool.setuptools.packages.find]
include = ["market_event_radar*"]
